<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crowdify | Intelligence Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2567/2567114.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
</head>

<body>
    <div id="vanta-bg"></div>
    <header>
        <h1>Crowdify</h1>
        <p>Advanced real-time crowd analytics and social density monitoring</p>
    </header>

    <main class="dashboard">
        <section class="video-section">
            <div class="video-container">
                <div class="video-inner">
                    <img id="video-feed" src="{{ url_for('video_feed') }}" alt="Live Intelligence Feed">
                    <div class="live-badge">
                        <span class="live-dot"></span>
                        LIVE FEED
                    </div>
                </div>
            </div>
        </section>

        <section class="stats-panel">
            <div class="stat-card">
                <span class="stat-label">People Detected</span>
                <span id="people-count" class="stat-value">00</span>
            </div>

            <div class="stat-card cluster-card">
                <span class="stat-label">Density Clusters</span>
                <span id="cluster-count" class="stat-value">00</span>
            </div>

            <div class="alert-section">
                <div id="status-indicator">
                    SYSTEM NORMAL
                </div>
            </div>
        </section>
    </main>

    <script>
        const peopleCountEl = document.getElementById('people-count');
        const clusterCountEl = document.getElementById('cluster-count');
        const statusIndicator = document.getElementById('status-indicator');

        async function updateStats() {
            try {
                const response = await fetch('/stats');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();

                peopleCountEl.innerText = data.people_count.toString().padStart(2, '0');
                clusterCountEl.innerText = data.cluster_count.toString().padStart(2, '0');

                if (data.alert) {
                    statusIndicator.classList.add('alert');
                    statusIndicator.innerText = "CROWD ALERT DETECTED";
                } else {
                    statusIndicator.classList.remove('alert');
                    statusIndicator.innerText = "SYSTEM NORMAL";
                }
            } catch (error) {
                console.error('Failed to update stats:', error);
            }
        }

        setInterval(updateStats, 800);
        updateStats();

        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x6366f1,
            backgroundColor: 0x020617,
            points: 12.00,
            maxDistance: 20.00,
            spacing: 16.00
        })
    </script>
</body>

</html>
